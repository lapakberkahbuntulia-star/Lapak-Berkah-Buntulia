<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 overflow-hidden relative z-10">
<div class="h-2 w-full bg-gradient-to-r from-primary to-secondary"></div>
<div class="p-xl flex flex-col items-center">
<div class="w-32 h-32 mb-lg rounded-full overflow-hidden shadow-sm border border-surface-variant flex items-center justify-center bg-surface">
<img alt="Lapak Berkah Buntulia Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB49vG9Vi3qbccoLZTXOLCqShe83hxitKq-wO3Iud7yeRH4bnZt2z0KcWxLd05BsiXOGCsKYwMKMXivhLKmYbr5fjtWgLkZixOEhtdAXQMZFIsO098CSV5idKs-jD4BvjZ4O9yC5r0GgwI95lKuy2oX4MFkNyI0hV-fY2GQnKYnBnyKDMJHPpOFzE66yL9OywVNAdvHQb1dvhuWq4bYsPLpVExHIszD98fWP0RqV2EVmKnMEPCPM_8WEaD-B1rebwVHSrA"/>

<div class="text-center mb-xl w-full">
<h1 class="font-headline-md text-headline-md text-primary mb-xs">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your Lapak Berkah account</p>
</div>
<form class="w-full space-y-md">
<div class="relative">
<label class="sr-only" for="email">Email Address</label>
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined">mail</span>
</div>
<input class="w-full h-touch-target-min pl-10 pr-4 py-2 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline/70" id="email" name="email" placeholder="Email Address" type="email"/>
</div>
<div class="relative">
<label class="sr-only" for="password">Password</label>
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="w-full h-touch-target-min pl-10 pr-10 py-2 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline/70" id="password" name="password" placeholder="Password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<div class="flex items-center justify-between mt-sm mb-lg">
<label class="flex items-center">
<input class="form-checkbox h-4 w-4 text-primary rounded border-outline-variant focus:ring-primary focus:ring-2" type="checkbox"/>
<span class="ml-2 font-label-sm text-label-sm text-on-surface-variant">Remember me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full h-touch-target-min bg-primary text-on-primary rounded-lg font-label-md text-label-md shadow-sm hover:bg-primary-fixed-variant transition-colors active:scale-95 flex items-center justify-center gap-2 mt-lg" type="button">
<span>Login</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="mt-xl pt-lg border-t border-outline-variant/30 w-full">
<h3 class="font-label-sm text-label-sm text-outline text-center mb-sm uppercase tracking-wider">Role Redirection Information</h3>
<ul class="space-y-xs text-center font-body-md text-body-md text-on-surface-variant/80">
<li class="flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px] text-primary">admin_panel_settings</span>
                        Admin/Owner → <span class="font-medium text-on-surface">Laporan</span>
</li>
<li class="flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px] text-secondary">handshake</span>
                        Mitra → <span class="font-medium text-on-surface">Mitra Dashboard</span>
</li>
<li class="flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px] text-tertiary-container">point_of_sale</span>

</li>
</ul>
